name: Bug report
description: Something doesn't work as expected
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill in the fields below so we can reproduce the issue.
  - type: input
    id: ide99-version
    attributes:
      label: ide99 version
      description: From Help → About, or `ide99 --version`
      placeholder: "1.0.2"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: "macOS 14.5 / Ubuntu 22.04 / Windows 11 23H2"
    validations:
      required: true
  - type: input
    id: pg-version
    attributes:
      label: PostgreSQL version
      placeholder: "PostgreSQL 16.2"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A minimal sequence of actions that triggers the bug.
      placeholder: |
        1. Open ide99
        2. Connect to a fresh PG 16 instance
        3. Click "..."
        4. Observe: ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Attach logs from `<data_dir>/logs/` if relevant. Screenshots help.
