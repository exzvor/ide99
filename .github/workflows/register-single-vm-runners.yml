name: Register single-VM runners

on:
  workflow_dispatch:
    inputs:
      landing_token:
        description: "Runner registration token for exzvor/ide99-landing"
        required: true
        type: string
      admin_token:
        description: "Runner registration token for exzvor/ide99-admin"
        required: true
        type: string

jobs:
  register:
    runs-on: [self-hosted, Linux, X64, ide99-ci-vm]
    steps:
      - name: Register landing runner on instant VM
        env:
          REG_TOKEN: ${{ inputs.landing_token }}
        run: |
          set -euo pipefail
          sudo install -d -o "$USER" -g "$USER" /opt/actions-runner-ide99-landing
          cd /opt/actions-runner-ide99-landing
          if [ ! -f config.sh ]; then
            curl -fsSL -o /tmp/actions-runner-ide99-landing.tgz \
              https://github.com/actions/runner/releases/download/v2.319.1/actions-runner-linux-x64-2.319.1.tar.gz
            tar xzf /tmp/actions-runner-ide99-landing.tgz
            rm -f /tmp/actions-runner-ide99-landing.tgz
          fi
          if [ -f .runner ]; then
            sudo ./svc.sh stop || true
            ./config.sh remove --unattended --token "$REG_TOKEN" || true
          fi
          ./config.sh --unattended \
            --url https://github.com/exzvor/ide99-landing \
            --token "$REG_TOKEN" \
            --name ide99-landing-on-instant-beta \
            --labels self-hosted,Linux,X64,ide99-landing-vm \
            --work _work \
            --replace
          sudo ./svc.sh install "$USER" || true
          sudo ./svc.sh start
          sudo ./svc.sh status | head -20

      - name: Register admin runner on instant VM
        env:
          REG_TOKEN: ${{ inputs.admin_token }}
        run: |
          set -euo pipefail
          sudo install -d -o "$USER" -g "$USER" /opt/actions-runner-ide99-admin
          cd /opt/actions-runner-ide99-admin
          if [ ! -f config.sh ]; then
            curl -fsSL -o /tmp/actions-runner-ide99-admin.tgz \
              https://github.com/actions/runner/releases/download/v2.319.1/actions-runner-linux-x64-2.319.1.tar.gz
            tar xzf /tmp/actions-runner-ide99-admin.tgz
            rm -f /tmp/actions-runner-ide99-admin.tgz
          fi
          if [ -f .runner ]; then
            sudo ./svc.sh stop || true
            ./config.sh remove --unattended --token "$REG_TOKEN" || true
          fi
          ./config.sh --unattended \
            --url https://github.com/exzvor/ide99-admin \
            --token "$REG_TOKEN" \
            --name ide99-admin-on-instant-beta \
            --labels self-hosted,Linux,X64,ide99-admin-vm \
            --work _work \
            --replace
          sudo ./svc.sh install "$USER" || true
          sudo ./svc.sh start
          sudo ./svc.sh status | head -20
