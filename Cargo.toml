[workspace]
resolver = "2"
members = ["src-tauri"]

[workspace.package]
version = "1.0.5"
edition = "2021"
authors = ["exzvor <exzvor@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/exzvor/ide99"
homepage = "https://ide99.ru"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

# Default clippy groups (correctness, suspicious, complexity, perf, style)
# remain at their defaults (`warn`). pedantic + nursery were originally
# enabled as project guidance, but with `RUSTFLAGS=-Dwarnings` plus
# `cargo clippy ... -- -D warnings` they elevate ~130 stylistic suggestions
# into hard CI failures, blocking the v1.0 release-readiness gate. They
# stay `allow`-by-default and can be opted into locally with
# `cargo clippy -- -W clippy::pedantic -W clippy::nursery` for cleanup work.
[workspace.lints.clippy]
pedantic = "allow"
nursery = "allow"
# Default-on stylistic lints that the codebase intentionally violates and
# are not actual bugs. Re-enabling them locally is fine for cleanup PRs;
# the v1.0 CI gate focuses on correctness, security, and platform compat.
vec_init_then_push = "allow"          # readable when many conditional pushes follow
field_reassign_with_default = "allow" # `Default::default()` + selective fields is fine
cloned_ref_to_slice_refs = "allow"    # clippy 1.95 lint, low signal here
manual_clamp = "allow"
unnecessary_sort_by = "allow"
# Promoted from pedantic to style in clippy 1.88, so it now fires under
# `-D warnings` in CI. The codebase has dozens of pre-format-args call
# sites — converting them is a follow-up cleanup PR, not a release gate.
uninlined_format_args = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Criterion benches need `panic = "unwind"` (criterion's harness catches
# panics around the benchmarked closure). Without the explicit profile
# the bench build silently inherits `[profile.release]` (panic = "abort"),
# every dependency was compiled with unwind, and the link step fails with
# "requires panic strategy abort which is incompatible with this crate's
# strategy of unwind". The shape mirrors release so bench numbers stay
# representative.
#
# Note on the cargo warning ("panic setting is ignored for bench
# profile"): the message is misleading — empirically (verified on
# GH-hosted ubuntu-22.04, S37 release-readiness gate) removing this
# line restores the broken inheritance from release, so it MUST stay.
[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
